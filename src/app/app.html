<div class="card card-body p-4 shadow m-5">
  
  <h3 class="text-primary">Sistema de gerenciamento de clientes</h3>
  <p>Preencha o formulário abaixo para incluir um cliente:</p>
  <hr/>

  <form [formGroup]="formulario" (ngSubmit)="cadastrar()">

    <div class="mb-3">
      <label>Nome do cliente:</label>
      <input type="text" placeholder="Ex: João da Silva"
             class="form-control" formControlName="nome">
    </div>

    <div class="mb-3">
      <label>Endereço de e-mail:</label>
      <input type="email" placeholder="Ex: joaodasilva@email.com"
             class="form-control" formControlName="email">
    </div>

    <div class="mb-3">
      <label>Telefone:</label>
      <input type="tel" placeholder="Ex: (21) 99999-0000"
             class="form-control" formControlName="telefone">
    </div>

    <div class="mb-3">
      <label>Selecione o tipo de cliente:</label>
      <div>
        <input type="radio" formControlName="tipo"
               value="PESSOA_FISICA"/> Pessoa física
      </div>
      <div>
        <input type="radio" formControlName="tipo"
               value="PESSOA_JURIDICA"/> Pessoa jurídico
      </div>
    </div>

    <div>
      <input type="submit" value="Realizar cadastro" 
             class="btn btn-success">
    </div>

  </form>

</div>
